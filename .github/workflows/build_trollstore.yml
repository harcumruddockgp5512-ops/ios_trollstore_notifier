name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Complete iOS Project Template
        run: |
          # 备份当前的自定义 lib、pubspec 和 Runner 配置
          mkdir -p /tmp/my_backup
          cp -r mobile_app/lib /tmp/my_backup/
          cp mobile_app/pubspec.yaml /tmp/my_backup/
          cp -r mobile_app/ios/Runner /tmp/my_backup/

          # 创建完整的 Flutter iOS 项目模版 (包含 Xcode 完整工程文件)
          rm -rf mobile_app
          flutter create --platforms=ios --org com.antigravity.crypto mobile_app

          # 将自定义代码与 TrollStore 特殊权限配置无缝覆盖回去
          cp -r /tmp/my_backup/lib mobile_app/
          cp /tmp/my_backup/pubspec.yaml mobile_app/
          cp -r /tmp/my_backup/Runner/* mobile_app/ios/Runner/

      - name: Install Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build iOS App (No Codesign for TrollStore)
        working-directory: mobile_app
        run: |
          # 禁用 Xcode 代码签名与 Team 检查，输出纯净 TrollStore Runner.app
          flutter build ios --config-only
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build/ios_output \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Package Unsigned TrollStore IPA
        run: |
          mkdir -p Payload
          cp -r mobile_app/build/ios_output/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r -y TrollStore_CryptoNotifier.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore_CryptoNotifier_IPA
          path: TrollStore_CryptoNotifier.ipa
