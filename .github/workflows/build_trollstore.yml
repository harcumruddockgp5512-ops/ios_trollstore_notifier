name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Complete iOS Project Template
        run: |
          # 备份当前的自定义 lib、pubspec 和 Runner 配置
          mkdir -p /tmp/my_backup
          cp -r mobile_app/lib /tmp/my_backup/
          cp mobile_app/pubspec.yaml /tmp/my_backup/
          cp -r mobile_app/ios/Runner /tmp/my_backup/

          # 创建完整的 Flutter iOS 项目模版 (包含 Xcode 完整工程文件)
          rm -rf mobile_app
          flutter create --platforms=ios --org com.antigravity.crypto mobile_app

          # 将自定义代码与 TrollStore 特殊权限配置无缝覆盖回去
          cp -r /tmp/my_backup/lib mobile_app/
          cp /tmp/my_backup/pubspec.yaml mobile_app/
          cp -r /tmp/my_backup/Runner/* mobile_app/ios/Runner/

      - name: Install Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build iOS App (No Codesign for TrollStore)
        working-directory: mobile_app
        run: |
          # 1. 生成 Flutter iOS 基础依赖与资源 (免签模式)
          flutter build ios --config-only

          # 2. 注入免证书配置到 project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_REQUIRED = NO; CODE_SIGNING_ALLOWED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DevelopmentTeam = "";/DevelopmentTeam = ""; CODE_SIGNING_REQUIRED = NO; CODE_SIGNING_ALLOWED = NO;/g' ios/Runner.xcodeproj/project.pbxproj

          # 3. 使用 xcodebuild 编译 ARM64 真机二进制
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned TrollStore IPA
        run: |
          mkdir -p Payload
          # 提取 Xcode 编译好的 Release-iphoneos/Runner.app
          APP_PATH=$(find mobile_app/build -name "Runner.app" -type d | grep "Release-iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d | grep "Release-iphoneos" | head -n 1)
          fi
          echo "Packing app from: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -y TrollStore_CryptoNotifier.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore_CryptoNotifier_IPA
          path: TrollStore_CryptoNotifier.ipa
