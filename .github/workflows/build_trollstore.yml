name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build iOS App (No Codesign for TrollStore)
        working-directory: mobile_app
        run: |
          flutter build ios --release --no-codesign

      - name: Package Unsigned TrollStore IPA
        run: |
          mkdir -p Payload
          cp -r mobile_app/build/ios/iphoneos/Runner.app Payload/
          zip -r -y TrollStore_CryptoNotifier.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore_CryptoNotifier_IPA
          path: TrollStore_CryptoNotifier.ipa
